name: Build unsigned IPA
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project AlabasterDawn.xcodeproj -scheme AlabasterDawn \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 40
          test -f build/Build/Products/Release-iphoneos/AlabasterDawn.app/AlabasterDawn
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AlabasterDawn.app Payload/
          zip -qr AlabasterDawn.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AlabasterDawn-ipa
          path: AlabasterDawn.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
